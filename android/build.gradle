// android/build.gradle

    buildscript {
        ext.kotlin_version = '2.1.0'

        repositories {
            google()
            mavenCentral()
        }

        dependencies {
            // Kotlin Gradle plugin updated to match the latest version
            classpath 'com.android.tools.build:gradle:8.9.1'
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"  // Kotlin plugin
            classpath 'com.google.gms:google-services:4.3.14'  // Update Google services plugin if necessary
        }
    }

    allprojects {
        repositories {
            google()
            mavenCentral()
        }
    }

    rootProject.buildDir = "../build"
    subprojects {
        project.buildDir = "${rootProject.buildDir}/${project.name}"
    }

    subprojects {
        project.evaluationDependsOn(":app")
    }

    tasks.register("clean", Delete) {
        delete rootProject.buildDir
    }
